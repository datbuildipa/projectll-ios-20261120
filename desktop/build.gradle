plugins {
    id 'application'
}

allprojects {
    repositories { mavenCentral() }
}

// Also support an independent desktop build without an Android SDK.
if (rootProject == project) {
    allprojects {
        ext.appName = 'LangLaMeme'
        apply plugin: 'eclipse'
    }
    project(':core') {
        apply plugin: 'java-library'
        dependencies {
            api 'com.badlogicgames.gdx:gdx:1.12.1'
            implementation 'com.badlogicgames.gdx:gdx-freetype:1.12.1'
        }
    }
}

version = '1.0'
sourceCompatibility = 1.8
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets.main.java.srcDirs = ['src']
sourceSets.main.resources.srcDirs = ['../assets']
sourceSets.main.resources.exclude 'LangLaZ/**', '**/.DS_Store'

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.1'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.12.1'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop'
    runtimeOnly 'com.badlogicgames.gdx:gdx-freetype-platform:1.12.1:natives-desktop'
}

application {
    mainClass = 'com.mygdx.game.DesktopLauncher'
    applicationName = 'LangLaDesktop'
}

tasks.named('run') { workingDir = file('../assets') }

distributions {
    main {
        contents { from('Run-LangLa.bat') }
    }
}
